# This is a Declarative Automation Bundle definition for databricks_codex.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_codex
  uuid: 437e2a1b-6c1c-4597-ac4c-e2f15b78c6e6

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-54699f94-cd54.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-54699f94-cd54.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/alex@a2e.dev.br to make sure we only have a single copy.
      root_path: /Workspace/Users/alex@a2e.dev.br/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: alex@a2e.dev.br
        level: CAN_MANAGE
